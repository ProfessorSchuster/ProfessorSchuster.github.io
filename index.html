<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cedric's Github Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f9f8;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    p.subtitle {
      color: #999;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 320px;
    }

    a.nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    a.nav-item:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
      border-color: #ccc;
    }

    .nav-item .icon {
      font-size: 1.25rem;
    }

    .nav-item .label {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .nav-item .arrow {
      margin-left: auto;
      color: #ccc;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <h1>Cedric's Github Page</h1>
  <p class="subtitle">A small collection of web utilities by C.S.</p>

  <nav>
    <a class="nav-item" href="/notion-widgets">
      <span class="label">Notion Widgets</span>
      <span class="arrow">→</span>
    </a>
  </nav>
</body>

</html>
